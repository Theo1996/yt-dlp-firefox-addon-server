<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 540px;
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: 'Consolas', 'Monaco', monospace;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      border-bottom: 1px solid #222;
      padding-bottom: 12px;
    }
    .header h3 { color: #ff4444; font-size: 15px; }
    .label {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .error-box {
      background: #1a1a1a;
      border: 1px solid #ff444433;
      border-left: 3px solid #ff4444;
      border-radius: 4px;
      padding: 12px;
      font-size: 11px;
      line-height: 1.7;
      color: #ff9999;
      max-height: 130px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 12px;
    }
    .error-box::-webkit-scrollbar { width: 5px; }
    .error-box::-webkit-scrollbar-track { background: #111; }
    .error-box::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    .kv { font-size: 11px; color: #bbb; margin-bottom: 10px; word-break: break-all; }
    .kv a, .fail a { color: #569cd6; cursor: pointer; text-decoration: underline; }
    #failures { max-height: 190px; overflow-y: auto; margin-bottom: 10px; }
    .fail { background: #1a1a1a; border-left: 3px solid #ff4444; border-radius: 4px; padding: 8px 10px; margin-bottom: 6px; font-size: 11px; line-height: 1.6; word-break: break-all; }
    .fail .meta { color: #777; }
    .fail .why { color: #ff9999; }
    .fail .hint { color: #e0b050; }
    .label a { color: #569cd6; cursor: pointer; margin-left: 8px; text-transform: none; letter-spacing: 0; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    .log-note { font-size: 11px; color: #555; margin-bottom: 14px; }
    .log-note span { color: #888; }
    #dismiss, #copy, #save {
      padding: 9px;
      background: #1e1e1e;
      color: #aaa;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }
    #dismiss:hover { background: #252525; color: #fff; border-color: #444; }
  </style>
</head>
<body>
  <div class="header"><h3>⚠ Download Error</h3></div>
  <div class="label">Requested URL / time</div>
  <div id="url" class="kv">Loading...</div>
  <div class="label">Failed items</div>
  <div id="failures"></div>
  <div class="label">yt-dlp output <a id="toggle">show full</a></div>
  <div id="error-box" class="error-box">Loading...</div>
  <div class="log-note">Server logs (1 file per failed video): <span id="logpath">...</span></div>
  <div class="row">
    <button id="copy">Copy report</button>
    <button id="save">Save report .txt</button>
    <button id="dismiss">Dismiss</button>
  </div>
  <script src="error.js"></script>
</body>
</html>
